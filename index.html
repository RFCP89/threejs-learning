<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page scale correctly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calm Creek — three.js learning</title>
    <!-- Vite lets us link CSS straight from the src folder -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      The <canvas> is the "screen" three.js draws onto.
      WebGL (the browser's GPU drawing API) can only paint inside a canvas.
    -->
    <canvas id="scene"></canvas>

    <!--
      Step 11: plain HTML elements floating ON TOP of the canvas.
      Text is much easier (and sharper) in HTML than in 3D. JavaScript moves the label
      every frame so it follows a person's head on screen.
    -->
    <div id="label" class="label" hidden>
      <strong class="label-name"></strong>
      <span class="label-about"></span>
    </div>
    <p class="hint">Drag to look around · scroll to zoom · click someone to meet them</p>

    <!-- Time of day: real <button> elements, so they work with the keyboard (Tab, Enter)
         and screen readers for free. main.js listens for their clicks. -->
    <div class="time-of-day" role="group" aria-label="Time of day">
      <button type="button" data-time="day">Day</button>
      <button type="button" data-time="sunset">Sunset</button>
      <button type="button" data-time="night">Night</button>
    </div>

    <!--
      type="module" means we can use `import` in our JS.
      Vite intercepts this file and resolves imports like `import * as THREE from 'three'`.
    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
